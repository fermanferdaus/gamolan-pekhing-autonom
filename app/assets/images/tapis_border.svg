<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60">
  <!-- Ornamen Tapis Lampung - border pattern -->
  <defs>
    <pattern id="tapis" x="0" y="0" width="40" height="60" patternUnits="userSpaceOnUse">
      <!-- Motif tumpal / pucuk rebung (segitiga berulang) -->
      <polygon points="20,5 35,25 5,25" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <polygon points="20,10 30,22 10,22" fill="#D4AF37" opacity="0.3"/>
      <!-- Garis horizontal -->
      <line x1="0" y1="28" x2="40" y2="28" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
      <!-- Motif belah ketupat / wajik -->
      <polygon points="20,32 28,42 20,52 12,42" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
      <polygon points="20,36 24,42 20,48 16,42" fill="#D4AF37" opacity="0.25"/>
      <!-- Dot pada ujung -->
      <circle cx="20" cy="5" r="1.5" fill="#D4AF37" opacity="0.6"/>
      <circle cx="20" cy="55" r="1.5" fill="#D4AF37" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="60" fill="url(#tapis)"/>
</svg>
