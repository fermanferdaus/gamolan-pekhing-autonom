<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- Gamolan Pekhing silhouette - 8 bilah bambu pada rangka -->
  <defs>
    <linearGradient id="bamboo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C3A21"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
  </defs>
  <!-- Rangka atas & bawah -->
  <rect x="10" y="8" width="380" height="8" rx="4" fill="url(#frame)"/>
  <rect x="10" y="104" width="380" height="8" rx="4" fill="url(#frame)"/>
  <!-- Tiang kiri & kanan -->
  <rect x="10" y="8" width="8" height="104" rx="4" fill="url(#frame)"/>
  <rect x="382" y="8" width="8" height="104" rx="4" fill="url(#frame)"/>
  <!-- 8 bilah dengan ukuran menurun -->
  <rect x="30" y="20" width="36" height="80" rx="5" fill="url(#bamboo)" opacity="0.95"/>
  <rect x="74" y="22" width="36" height="76" rx="5" fill="url(#bamboo)" opacity="0.9"/>
  <rect x="118" y="24" width="36" height="72" rx="5" fill="url(#bamboo)" opacity="0.85"/>
  <rect x="162" y="26" width="36" height="68" rx="5" fill="url(#bamboo)" opacity="0.8"/>
  <rect x="206" y="28" width="36" height="64" rx="5" fill="url(#bamboo)" opacity="0.75"/>
  <rect x="250" y="30" width="36" height="60" rx="5" fill="url(#bamboo)" opacity="0.7"/>
  <rect x="294" y="32" width="36" height="56" rx="5" fill="url(#bamboo)" opacity="0.65"/>
  <rect x="338" y="34" width="36" height="52" rx="5" fill="url(#bamboo)" opacity="0.6"/>
  <!-- Label nada -->
  <text x="48" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1</text>
  <text x="92" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2</text>
  <text x="136" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3</text>
  <text x="180" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4</text>
  <text x="224" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">5</text>
  <text x="268" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">6</text>
  <text x="312" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">7</text>
  <text x="356" y="68" font-family="serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">8</text>
</svg>
