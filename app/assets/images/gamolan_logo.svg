<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- GAMOLAN PEKHING: FREEHAND APP LOGO (FLAT ROYAL BLUE) -->
  <!-- 1. App Icon Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1E3A8A"/>
  <rect x="5" y="5" width="118" height="118" rx="27" stroke="#3B82F6" stroke-width="2.2" fill="none"/>

  <!-- 2. Mahkota Siger Lampung (Freehand Stroke) -->
  <path d="M 32 30 C 40 22, 46 26, 52 18 C 58 12, 64 10, 64 10 C 64 10, 70 12, 76 18 C 82 26, 88 22, 96 30 C 88 33, 76 26, 64 28 C 52 26, 40 33, 32 30 Z" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="9" r="2.2" fill="#60A5FA"/>

  <!-- 3. Stik Tabuh Pemukul Gamolan (Freehand Mallet) -->
  <path d="M 97 34 L 112 19" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="95" cy="36" r="4.2" fill="none" stroke="#93C5FD" stroke-width="2"/>

  <!-- 4. 8 Bilah Bambu Gamolan Pekhing (Stepped Diatonic Scale, Freehand Outlines) -->
  <!-- Bilah 1 (DO) -->
  <rect x="25" y="38" width="7" height="52" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26.5" y1="62" x2="30.5" y2="62" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 2 (RE) -->
  <rect x="35" y="41" width="7" height="49" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="36.5" y1="63" x2="40.5" y2="63" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 3 (MI) -->
  <rect x="45" y="44" width="7" height="46" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="46.5" y1="64" x2="50.5" y2="64" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 4 (FA) -->
  <rect x="55" y="47" width="7" height="43" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56.5" y1="65" x2="60.5" y2="65" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 5 (SOL) -->
  <rect x="65" y="50" width="7" height="40" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="66.5" y1="66" x2="70.5" y2="66" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 6 (LA) -->
  <rect x="75" y="53" width="7" height="37" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="76.5" y1="67" x2="80.5" y2="67" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 7 (SI) -->
  <rect x="85" y="56" width="7" height="34" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="86.5" y1="68" x2="90.5" y2="68" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bilah 8 (DO') -->
  <rect x="95" y="59" width="7" height="31" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="96.5" y1="69" x2="100.5" y2="69" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 5. Tali Gantungan Bilah (Freehand Cord Thread) -->
  <path d="M 22 47 C 32 49, 42 47, 52 51 C 62 55, 72 53, 82 57 C 92 61, 98 59, 105 63" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/>

  <!-- 6. Dudukan Kayu Rancak (Freehand Carved Stand) -->
  <path d="M 19 96 C 35 94, 93 94, 109 96" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Kaki Lengkung Khas Lampung -->
  <path d="M 25 96 C 20 102, 22 108, 32 108 L 44 108 C 42 102, 38 98, 35 96" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 103 96 C 108 102, 106 108, 96 108 L 84 108 C 86 102, 90 98, 93 96" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
