<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Motif Kain Tapis Lampung Jung Sarat / Kapal Mas -->
  <defs>
    <linearGradient id="tapisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBA0"/>
      <stop offset="50%" stop-color="#E5B842"/>
      <stop offset="100%" stop-color="#9C7324"/>
    </linearGradient>
    <pattern id="tapisPattern" width="100" height="120" patternUnits="userSpaceOnUse">
      <!-- Border Garis Atas & Bawah -->
      <line x1="0" y1="4" x2="100" y2="4" stroke="url(#tapisGold)" stroke-width="1.5"/>
      <line x1="0" y1="10" x2="100" y2="10" stroke="url(#tapisGold)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="0" y1="110" x2="100" y2="110" stroke="url(#tapisGold)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="0" y1="116" x2="100" y2="116" stroke="url(#tapisGold)" stroke-width="1.5"/>

      <!-- Pucuk Rebung Segitiga Atas -->
      <polygon points="10,12 20,28 0,28" fill="url(#tapisGold)" opacity="0.8"/>
      <polygon points="30,12 40,28 20,28" fill="url(#tapisGold)" opacity="0.6"/>
      <polygon points="50,12 60,28 40,28" fill="url(#tapisGold)" opacity="0.8"/>
      <polygon points="70,12 80,28 60,28" fill="url(#tapisGold)" opacity="0.6"/>
      <polygon points="90,12 100,28 80,28" fill="url(#tapisGold)" opacity="0.8"/>

      <!-- Motif Jung / Kapal Lampung Tradisional di Tengah -->
      <!-- Badan Kapal Berlekuk -->
      <path d="M 15 75 Q 50 95 85 75 L 80 65 Q 50 80 20 65 Z" fill="url(#tapisGold)"/>
      <!-- Tiang Layar & Mahkota Perahu -->
      <line x1="50" y1="40" x2="50" y2="78" stroke="url(#tapisGold)" stroke-width="2"/>
      <polygon points="50,35 68,52 50,52" fill="url(#tapisGold)" opacity="0.9"/>
      <polygon points="50,42 35,56 50,56" fill="url(#tapisGold)" opacity="0.7"/>

      <!-- Ornamen Belah Ketupat / Sasab Intan Samping -->
      <polygon points="12,48 18,55 12,62 6,55" fill="none" stroke="url(#tapisGold)" stroke-width="1.2"/>
      <circle cx="12" cy="55" r="2" fill="url(#tapisGold)"/>
      <polygon points="88,48 94,55 88,62 82,55" fill="none" stroke="url(#tapisGold)" stroke-width="1.2"/>
      <circle cx="88" cy="55" r="2" fill="url(#tapisGold)"/>

      <!-- Pucuk Rebung Segitiga Bawah -->
      <polygon points="10,108 20,92 0,92" fill="url(#tapisGold)" opacity="0.8"/>
      <polygon points="30,108 40,92 20,92" fill="url(#tapisGold)" opacity="0.6"/>
      <polygon points="50,108 60,92 40,92" fill="url(#tapisGold)" opacity="0.8"/>
      <polygon points="70,108 80,92 60,92" fill="url(#tapisGold)" opacity="0.6"/>
      <polygon points="90,108 100,92 80,92" fill="url(#tapisGold)" opacity="0.8"/>
    </pattern>
  </defs>

  <rect width="400" height="120" fill="url(#tapisPattern)"/>
</svg>
