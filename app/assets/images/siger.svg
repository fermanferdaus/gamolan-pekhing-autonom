<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <!-- Siger Lampung - mahkota tradisional (simplified) -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Base band -->
  <path d="M 30,65 Q 100,55 170,65" stroke="url(#gold)" stroke-width="4" fill="none"/>
  <path d="M 25,70 Q 100,60 175,70" stroke="url(#gold)" stroke-width="3" fill="none"/>
  <!-- 9 puncak siger -->
  <polygon points="100,8 106,30 94,30" fill="url(#gold)"/>
  <polygon points="78,14 84,32 72,32" fill="url(#gold)" opacity="0.9"/>
  <polygon points="122,14 128,32 116,32" fill="url(#gold)" opacity="0.9"/>
  <polygon points="56,22 62,36 50,36" fill="url(#gold)" opacity="0.8"/>
  <polygon points="144,22 150,36 138,36" fill="url(#gold)" opacity="0.8"/>
  <polygon points="38,32 44,44 32,44" fill="url(#gold)" opacity="0.7"/>
  <polygon points="162,32 168,44 156,44" fill="url(#gold)" opacity="0.7"/>
  <!-- Hiasan titik pada puncak -->
  <circle cx="100" cy="6" r="2.5" fill="#FFD700"/>
  <circle cx="78" cy="12" r="2" fill="#FFD700" opacity="0.9"/>
  <circle cx="122" cy="12" r="2" fill="#FFD700" opacity="0.9"/>
  <circle cx="56" cy="20" r="1.8" fill="#FFD700" opacity="0.8"/>
  <circle cx="144" cy="20" r="1.8" fill="#FFD700" opacity="0.8"/>
  <!-- Garis penghubung -->
  <path d="M 34,44 Q 50,50 72,32 Q 85,25 94,30 Q 97,31 100,30 Q 103,31 106,30 Q 115,25 128,32 Q 150,50 166,44"
        stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.6"/>
</svg>
