<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" fill="none">
  <!-- Siger Mahkota Lampung - 9 Pucuk Tahta Keemasan -->
  <defs>
    <linearGradient id="goldSiger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBA0"/>
      <stop offset="35%" stop-color="#E5B842"/>
      <stop offset="70%" stop-color="#B8861C"/>
      <stop offset="100%" stop-color="#7A560E"/>
    </linearGradient>
    <linearGradient id="rubyGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C77"/>
      <stop offset="50%" stop-color="#BA273A"/>
      <stop offset="100%" stop-color="#590C17"/>
    </linearGradient>
    <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B37D14" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown Base Bands (Sabuk Mahkota) -->
  <path d="M 40 215 Q 250 185 460 215 L 452 230 Q 250 200 48 230 Z" fill="url(#goldSiger)"/>
  <path d="M 50 195 Q 250 168 450 195 L 445 208 Q 250 180 55 208 Z" fill="#7A560E"/>
  <path d="M 60 178 Q 250 152 440 178 L 436 188 Q 250 162 64 188 Z" fill="url(#goldSiger)"/>

  <!-- Permata Sabuk Mahkota -->
  <circle cx="100" cy="201" r="5" fill="url(#rubyGem)"/>
  <circle cx="150" cy="195" r="5" fill="url(#rubyGem)"/>
  <circle cx="200" cy="191" r="5" fill="url(#rubyGem)"/>
  <circle cx="250" cy="189" r="6" fill="url(#rubyGem)"/>
  <circle cx="300" cy="191" r="5" fill="url(#rubyGem)"/>
  <circle cx="350" cy="195" r="5" fill="url(#rubyGem)"/>
  <circle cx="400" cy="201" r="5" fill="url(#rubyGem)"/>

  <!-- Pucuk 1 & 9 (Paling Luar) -->
  <path d="M 60 180 Q 40 145 30 115 Q 55 125 78 155 Z" fill="url(#goldSiger)"/>
  <path d="M 440 180 Q 460 145 470 115 Q 445 125 422 155 Z" fill="url(#goldSiger)"/>
  <circle cx="30" cy="115" r="4.5" fill="#FFEBA0"/>
  <circle cx="470" cy="115" r="4.5" fill="#FFEBA0"/>

  <!-- Pucuk 2 & 8 -->
  <path d="M 85 168 Q 75 110 80 75 Q 110 105 125 150 Z" fill="url(#goldSiger)"/>
  <path d="M 415 168 Q 425 110 420 75 Q 390 105 375 150 Z" fill="url(#goldSiger)"/>
  <circle cx="80" cy="75" r="5" fill="#FFEBA0"/>
  <circle cx="420" cy="75" r="5" fill="#FFEBA0"/>
  <circle cx="80" cy="85" r="3" fill="url(#rubyGem)"/>
  <circle cx="420" cy="85" r="3" fill="url(#rubyGem)"/>

  <!-- Pucuk 3 & 7 -->
  <path d="M 130 155 Q 128 85 142 45 Q 165 85 180 142 Z" fill="url(#goldSiger)"/>
  <path d="M 370 155 Q 372 85 358 45 Q 335 85 320 142 Z" fill="url(#goldSiger)"/>
  <circle cx="142" cy="45" r="5.5" fill="#FFEBA0"/>
  <circle cx="358" cy="45" r="5.5" fill="#FFEBA0"/>
  <circle cx="142" cy="57" r="3.5" fill="url(#rubyGem)"/>
  <circle cx="358" cy="57" r="3.5" fill="url(#rubyGem)"/>

  <!-- Pucuk 4 & 6 -->
  <path d="M 185 145 Q 192 65 208 25 Q 225 70 235 140 Z" fill="url(#goldSiger)"/>
  <path d="M 315 145 Q 308 65 292 25 Q 275 70 265 140 Z" fill="url(#goldSiger)"/>
  <circle cx="208" cy="25" r="6" fill="#FFEBA0"/>
  <circle cx="292" cy="25" r="6" fill="#FFEBA0"/>
  <circle cx="208" cy="38" r="4" fill="url(#rubyGem)"/>
  <circle cx="292" cy="38" r="4" fill="url(#rubyGem)"/>

  <!-- Pucuk 5 (Pusat Tertinggi Mahkota Siger) -->
  <path d="M 235 140 Q 242 40 250 8 Q 258 40 265 140 Z" fill="url(#goldSiger)"/>
  <circle cx="250" cy="8" r="7.5" fill="#FFEBA0"/>
  <circle cx="250" cy="22" r="4.5" fill="url(#rubyGem)"/>

  <!-- Ornamen Renda Daun Emas Tengah -->
  <path d="M 215 130 Q 250 110 285 130 Q 250 155 215 130 Z" fill="url(#innerShade)"/>
  <circle cx="250" cy="132" r="6" fill="url(#rubyGem)"/>

  <!-- Hiasan Ukiran Sayap Kiri dan Kanan -->
  <path d="M 160 135 Q 205 120 230 145 Q 195 152 160 135 Z" fill="url(#innerShade)"/>
  <path d="M 340 135 Q 295 120 270 145 Q 305 152 340 135 Z" fill="url(#innerShade)"/>
</svg>
